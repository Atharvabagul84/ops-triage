# Lab for case "startup-arguments": a worker is deployed with a misspelled flag and exits.
# The container is a stand-in CLI that accepts only `--batch-size <integer>`.
apiVersion: v1
kind: Pod
metadata:
  name: queue-worker
  namespace: practice
  labels:
    app: queue-worker
spec:
  containers:
    - name: worker
      image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command:
        - sh
        - -c
        - |
          if [ "$1" != "--batch-size" ]; then
            echo "error: unknown option $1" >&2
            echo "usage: worker --batch-size <integer>" >&2
            echo "Exiting before initialization." >&2
            exit 2
          fi
          echo "Options accepted: batch-size=$2"
          exec sleep 3600
        - worker
      args: ["--batch-sze", "100"]
