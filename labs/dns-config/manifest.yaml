# Lab for case "dns-config": one client overrides its resolver with dnsPolicy: None and a
# public nameserver, which cannot answer cluster names. A second client keeps the default.
apiVersion: v1
kind: Pod
metadata:
  name: inventory
  namespace: practice
  labels:
    app: inventory
spec:
  containers:
    - name: inventory
      image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
      ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: practice
spec:
  selector:
    app: inventory
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: client-custom
  namespace: practice
spec:
  dnsPolicy: None
  dnsConfig:
    nameservers:
      - 8.8.8.8
  containers:
    - name: client
      image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client-default
  namespace: practice
spec:
  containers:
    - name: client
      image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["sleep", "3600"]
