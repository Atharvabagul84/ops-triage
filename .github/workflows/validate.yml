name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, unit, build and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      # Reserved test host and an inert public key; cloud tests intercept every request.
      NEXT_PUBLIC_SUPABASE_URL: https://cloud-test.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
      # Email requests are intercepted in this job; public builds keep this false until ready.
      NEXT_PUBLIC_AUTH_EMAIL_ENABLED: 'true'
      PLAYWRIGHT_MOCK_CLOUD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and content checks
        run: npm test
      - name: Match authored cases to the database event allowlist
        run: node --test supabase/tests/allowlist.test.mjs
      - name: Build production app
        run: npm run build
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium firefox
      - name: Exercise guest and mocked cloud journeys
        run: npx playwright test
      - name: Build the guest static export
        run: npm run build:static
        env:
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
          NEXT_PUBLIC_AUTH_EMAIL_ENABLED: 'false'
      - name: Enforce static asset budgets
        run: npm run test:performance
      - name: Keep browser failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-checks
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false
  database:
    name: Database ownership and revision checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # Official PostgreSQL 16 image verified with the disposable local SQL test.
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: opstriage_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opstriage_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5433/opstriage_ci
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes postgresql-client
      - name: Create isolated test auth fixture and apply migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/local-bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify ownership, revisions and usage boundaries
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/cloud_notebooks_and_usage_counts.sql
