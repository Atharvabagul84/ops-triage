name: Labs

# Reproduces each lab fault on a disposable kind cluster and asserts its symptom.
# The app's evidence is checked against the committed captures by `npm test` in Validate.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    paths:
      - 'labs/**'
      - '.github/workflows/labs.yml'

permissions:
  contents: read

concurrency:
  group: labs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Reproduce lab faults on kind
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KUBECTL_VERSION: v1.36.1
      KUBECTL_SHA256: 629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7
      NODE_IMAGE: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned kind and kubectl
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum --check
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum --check
          sudo install -m 0755 kind kubectl /usr/local/bin/
      - name: Create a disposable cluster
        run: kind create cluster --name ops-triage-labs --image "$NODE_IMAGE" --wait 180s
      - name: Reproduce each fault and check its symptom
        run: node labs/capture.mjs --out "$RUNNER_TEMP/captures"
      - name: Keep the fresh captures for comparison
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-captures
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore
          retention-days: 14
